[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arb"
version = "0.1.0"
description = "Sports betting arbitrage finder with a web dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arb-web = "arb.web:main"
arb-scan = "arb.scanner:main"

[tool.setuptools]
packages = ["arb"]

[tool.setuptools.package-data]
arb = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
